name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, canary, dev]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: validation
          POSTGRES_PASSWORD: validation
          POSTGRES_DB: node_security_validation
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U validation -d node_security_validation"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma Client
        run: pnpm --filter server exec prisma generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db

      - name: Lint
        run: pnpm lint

      - name: Type check (client)
        run: pnpm --filter client type-check

      - name: Type check (server)
        run: pnpm --filter server type-check

      - name: Test native node API and tunnel compatibility
        run: |
          pnpm --filter server exec tsx scripts/test-payincus-node-api.ts
          pnpm --filter server exec tsx scripts/test-agent-tunnel-protocol-guards.ts
          pnpm --filter server test:egress
          pnpm --filter server test:package-egress
          pnpm --filter server test:node-distribution

      - name: Node administration contracts
        env:
          DATABASE_URL: postgresql://validation:validation@localhost:5432/node_security_validation
        run: |
          pnpm --filter server test:node-security
          pnpm --filter server test:instance-advanced-config
          pnpm --filter server test:traffic-route-limit-guards

      - name: Native node installer handoff
        run: sudo python3 server/scripts/test-node-distribution-shell.py

      - name: Node key vault and durable report integration
        env:
          DATABASE_URL: postgresql://validation:validation@localhost:5432/node_security_validation
        run: |
          pnpm --filter server exec prisma db push
          pnpm --filter server test:node-security:db
          pnpm --filter server test:instance-advanced-config:db


  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma Client
        run: pnpm --filter server exec prisma generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db

      - name: Build
        run: pnpm build
