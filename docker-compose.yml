services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payincus}
      POSTGRES_USER: ${POSTGRES_USER:-payincus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-payincus} -d $${POSTGRES_DB:-payincus}"]
      interval: 10s
      timeout: 5s
      retries: 10

  payincus:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-payincus}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-payincus}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-payincus}}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - payincus-data:/opt/incudal
    ports:
      - "${USER_HTTP_PORT:-8080}:80"
      - "${ADMIN_HTTP_PORT:-8081}:81"

volumes:
  postgres-data:
  payincus-data:
